name: Alte interne Docker-Images bereinigen
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Ausgewählte interne Versionen nach erneuter Prüfung löschen'
        type: boolean
        default: false
      version_ids:
        description: 'GHCR-Versions-IDs aus der Vorschau, durch Leerzeichen getrennt (nur für Löschen)'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: docker-publication
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Registry-Werkzeug installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Vorschau oder ausdrücklich ausgewählte Versionen prüfen
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ inputs.apply }}
          VERSION_IDS: ${{ inputs.version_ids }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          args = ['python3', 'scripts/cleanup_registry.py', '--repository', os.environ['GITHUB_REPOSITORY'],
                  '--output', os.environ['RUNNER_TEMP'] + '/cleanup-plan.json']
          if os.environ['APPLY'] == 'true':
              values = os.environ['VERSION_IDS'].split()
              if not values or any(not re.fullmatch(r'[1-9][0-9]*', value) for value in values):
                  raise SystemExit('Zum Löschen konkrete Versions-IDs aus der Vorschau angeben.')
              for value in values:
                  args += ['--delete-version-id', value]
          elif os.environ['VERSION_IDS'].strip():
              raise SystemExit('Versions-IDs nur zusammen mit ausdrücklichem Löschen verwenden.')
          subprocess.run(args, check=True)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ghcr-cleanup-plan
          path: ${{ runner.temp }}/cleanup-plan.json
          if-no-files-found: warn
          retention-days: 7
