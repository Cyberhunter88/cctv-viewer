name: Release und Docker veröffentlichen
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version des getesteten Builds: vX.Y.Z oder vX.Y.Z-beta.1'
        required: true
        type: string
      commit:
        description: 'Optionaler vollständiger Main-Commit-SHA (leer = aktueller HEAD von main)'
        required: false
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: docker-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      create_release: ${{ steps.meta.outputs.create_release }}
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      image: ${{ steps.meta.outputs.image }}
      release: ${{ steps.meta.outputs.release }}
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.ci.outputs.ci_run_attempt }}
    steps:
      - name: Nur manuell auf main ausführen
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Release nur über Run workflow mit Branch main starten.'
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          python3 scripts/manual_release.py "$GITHUB_REPOSITORY" "$REQUESTED_VERSION" "$RUNNER_TEMP/event.json" "$GITHUB_OUTPUT" "$REQUESTED_COMMIT"
          export GITHUB_EVENT_PATH="$RUNNER_TEMP/event.json"
          export RELEASES_FILE="$RUNNER_TEMP/releases.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RELEASES_FILE"
          python3 scripts/release.py
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: ci
        name: Vollständige CI für exakt diesen Main-Commit verlangen
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: python3 scripts/wait_for_commit_ci.py "$GITHUB_REPOSITORY" "$COMMIT" "$GITHUB_OUTPUT"
      - name: Fehler zusammenfassen
        if: failure()
        run: echo '## Release abgebrochen · Version, Main-Zugehörigkeit oder vollständige Commit-CI fehlen. Details stehen im fehlgeschlagenen Schritt. Es wurde nichts veröffentlicht.' >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release }}
      CI_RUN_ID: ${{ needs.prepare.outputs.ci_run_id }}
      CI_RUN_ATTEMPT: ${{ needs.prepare.outputs.ci_run_attempt }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Werkzeuge für unveränderte Multiarch-Kopien installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Arbeitsdateien festlegen
        run: |
          {
            echo "PROOF_FILE=$RUNNER_TEMP/proof/commit-image-proof.json"
            echo "RELEASES_FILE=$RUNNER_TEMP/releases.json"
            echo "RELEASE_PROOF=$RUNNER_TEMP/release-proof.json"
          } >> "$GITHUB_ENV"
      - name: Buildnachweis und unveränderliche Images prüfen
        run: |
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "commit-image-proof-$CI_RUN_ATTEMPT" --dir "$RUNNER_TEMP/proof"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RELEASES_FILE"
          CHECK_ONLY=true bash scripts/promote_image.sh
          digest=$(python3 -c 'import json,os; print(json.load(open(os.environ["PROOF_FILE"]))["digest"])')
          source_image=$(python3 -c 'import json,os; print(json.load(open(os.environ["PROOF_FILE"]))["image"])')
          docker pull "$source_image@$digest"
          ./scripts/smoke.sh "$source_image@$digest" "$VERSION" "$COMMIT" amd64
      - name: Release und Konfiguration als Entwurf vorbereiten
        env:
          CREATE_RELEASE: ${{ needs.prepare.outputs.create_release }}
        run: |
          if [ "$CREATE_RELEASE" = true ]; then
            args=(--repo "$GITHUB_REPOSITORY" --target "$COMMIT" --title "CCTV Viewer $RELEASE_TAG" --generate-notes --draft --latest=false)
            if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          git show "$COMMIT:compose.yaml" > "$RUNNER_TEMP/compose.yaml"
          git show "$COMMIT:.env.example" | sed "s/^CTV_VERSION=.*/CTV_VERSION=$VERSION/" > "$RUNNER_TEMP/config.env.example"
      - name: Geprüftes Multiarch-Image ohne Neubau übernehmen
        env:
          VERSION_ONLY: 'true'
        run: bash scripts/promote_image.sh
      - name: Öffentlichen Release-Download prüfen
        run: |
          digest=$(python3 -c 'import json,os; print(json.load(open(os.environ["RELEASE_PROOF"]))["digest"])')
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker" docker pull "$IMAGE@$digest" || { echo 'Anonymer GHCR-Pull fehlgeschlagen. Release-Paket einmalig auf Public stellen und Workflow mit derselben Version und demselben Commit erneut starten.'; exit 1; }
      - name: Konfiguration und Digest-Nachweis anhängen
        run: python3 scripts/manual_release.py assets "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$RUNNER_TEMP/compose.yaml" "$RUNNER_TEMP/config.env.example" "$RELEASE_PROOF"
      - id: promote
        name: Versions-Aliases nach Download und Assets freigeben
        run: bash scripts/promote_image.sh
      - name: Vollständigen Entwurf offiziell veröffentlichen
        env:
          IS_LATEST: ${{ steps.promote.outputs.latest }}
        run: |
          draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" = true ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$IS_LATEST"
          fi
          echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Wiederaufnahme dokumentieren
        if: failure()
        run: |
          echo '## Veröffentlichung unvollständig' >> "$GITHUB_STEP_SUMMARY"
          echo 'Vorhandene korrekte Artefakte bleiben erhalten. Nach Beheben der Ursache mit derselben Version und demselben vollständigen Commit-SHA erneut starten. Keine Tags manuell verschieben.' >> "$GITHUB_STEP_SUMMARY"
