name: Release und Docker veröffentlichen
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag (vX.Y.Z), leer = Version aus package.json; bestehende Releases erneut veröffentlichen'
        required: false
        type: string
      commit:
        description: 'Getesteter Main-Commit (leer = aktueller Stand des ausgewählten Branches)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: docker-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      create_release: ${{ steps.meta.outputs.create_release }}
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      image: ${{ steps.meta.outputs.image }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            python3 scripts/manual_release.py "$GITHUB_REPOSITORY" "$REQUESTED_TAG" "$RUNNER_TEMP/event.json" "$GITHUB_OUTPUT" "$REQUESTED_COMMIT"
            export GITHUB_EVENT_PATH="$RUNNER_TEMP/event.json"
          else
            tag=$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["release"]["tag_name"])')
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            echo "commit=$(git rev-parse "$tag^{commit}")" >> "$GITHUB_OUTPUT"
            echo 'create_release=false' >> "$GITHUB_OUTPUT"
          fi
          export RELEASES_FILE="$RUNNER_TEMP/releases.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RELEASES_FILE"
          python3 scripts/release.py
          tag=$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["release"]["tag_name"])')
          echo "release=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Erfolgreiche Commit-CI einschließlich Image-Build abwarten
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: python3 scripts/wait_for_commit_ci.py "$GITHUB_REPOSITORY" "$COMMIT"
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Neues GitHub-Release für den geprüften Commit erstellen
        if: needs.prepare.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --target "$COMMIT" --title "CCTV Viewer $RELEASE_TAG" --generate-notes)
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" "${args[@]}"
      - name: Unveränderliche Version und Versionszeiger veröffentlichen
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nach der Wartezeit neu berechnen: Inzwischen kann ein neueres Release existieren.
          export RELEASES_FILE="$RUNNER_TEMP/releases.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RELEASES_FILE"
          bash scripts/promote_image.sh
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Konfiguration an Release anhängen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cp compose.yaml "$RUNNER_TEMP/compose.yaml"
          sed "s/^CTV_VERSION=.*/CTV_VERSION=$VERSION/" .env.example > "$RUNNER_TEMP/config.env.example"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/compose.yaml" "$RUNNER_TEMP/config.env.example" --clobber
      - name: Öffentlichen Download und Containerstart prüfen
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker logout ghcr.io
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker" docker pull "$IMAGE:$VERSION" || { echo 'GHCR-Paket einmalig in den Paketeinstellungen auf Public stellen, dann Workflow erneut starten.'; exit 1; }
          ./scripts/smoke.sh "$IMAGE:$VERSION"
