name: Docker veröffentlichen
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Vorhandenes veröffentlichtes Release erneut verarbeiten (vX.Y.Z)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: docker-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      ref: ${{ steps.meta.outputs.ref }}
      commit: ${{ steps.meta.outputs.commit }}
      image: ${{ steps.meta.outputs.image }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$REQUESTED_TAG" > "$RUNNER_TEMP/release.json"
            python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert not r["draft"]; json.dump({"release":r},open(sys.argv[2],"w"))' "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/event.json"
            export GITHUB_EVENT_PATH="$RUNNER_TEMP/event.json"
          fi
          export RELEASES_FILE="$RUNNER_TEMP/releases.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RELEASES_FILE"
          python3 scripts/release.py
          tag=$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["release"]["tag_name"])')
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          echo "commit=$(git rev-parse "$tag^{commit}")" >> "$GITHUB_OUTPUT"
          echo "ref=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
  build:
    needs: [prepare, checks]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: cctv-viewer:test
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - run: ./scripts/smoke.sh cctv-viewer:test
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ needs.prepare.outputs.image }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Unveränderliche Version und Versionszeiger veröffentlichen
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          expected=$(git rev-parse HEAD)
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > "$RUNNER_TEMP/existing" 2> "$RUNNER_TEMP/inspect-error"; then
            docker pull --platform linux/amd64 "$IMAGE:$VERSION"
            revision=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE:$VERSION")
            test "$revision" = "$expected" || { echo 'Versions-Tag gehört bereits zu anderem Commit.'; exit 1; }
          else
            grep -Eiq 'not found|manifest unknown|name unknown' "$RUNNER_TEMP/inspect-error" || { cat "$RUNNER_TEMP/inspect-error"; exit 1; }
            docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64" "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64"
          fi
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          IFS=',' read -ra tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            if [ "$tag" != "$VERSION" ]; then docker buildx imagetools create -t "$IMAGE:$tag" "$IMAGE@$digest"; fi
          done
          echo "## Docker-Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Konfiguration an Release anhängen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cp compose.yaml "$RUNNER_TEMP/compose.yaml"
          sed "s/^CTV_VERSION=.*/CTV_VERSION=$VERSION/" .env.example > "$RUNNER_TEMP/config.env.example"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/compose.yaml" "$RUNNER_TEMP/config.env.example" --clobber
      - name: Öffentlichen Download und Containerstart prüfen
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker logout ghcr.io
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker" docker pull "$IMAGE:$VERSION" || { echo 'GHCR-Paket einmalig in den Paketeinstellungen auf Public stellen, dann Workflow erneut starten.'; exit 1; }
          ./scripts/smoke.sh "$IMAGE:$VERSION"
