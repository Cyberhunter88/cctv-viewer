name: CCTV Viewer im PR prüfen
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  code-checks:
    name: Code prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.checks.outputs.commit }}
      image: ${{ steps.checks.outputs.image }}
      version: ${{ steps.checks.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - id: checks
        uses: ./.github/actions/code-checks
      - name: Browser-Testserver bauen
        run: mkdir -p bin && go build -o bin/cctv ./cmd/cctv && cp "$CTV_TEST_GO2RTC" bin/go2rtc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-server
          path: |
            bin/cctv
            bin/go2rtc
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
  browser:
    name: Browser prüfen (${{ matrix.browser }})
    needs: code-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            engine: chromium
          - browser: webkit
            engine: webkit
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.code-checks.outputs.commit }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.10.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-test-server
          path: bin
      - run: chmod +x bin/cctv bin/go2rtc
      - name: Playwright Cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ matrix.browser }}-
      - name: Browser- und Systemabhängigkeiten installieren
        run: |
          bash scripts/install_browser_ci_tools.sh ${{ matrix.browser }}
          npx playwright install ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          CTV_TEST_ENGINE: ${{ matrix.engine }}
          CTV_TEST_GO2RTC: ${{ github.workspace }}/bin/go2rtc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
  test:
    # Keep this name stable: main requires this exact status check.
    name: Anwendung prüfen
    if: always()
    needs: [code-checks, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Alle erforderlichen Prüfungen verlangen
        env:
          CODE_RESULT: ${{ needs.code-checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          {
            echo '## Ergebnis der Pflichtprüfungen'
            echo
            echo "Code: $CODE_RESULT"
            echo "Browser (Chrome und WebKit): $BROWSER_RESULT"
            echo 'Nächster Schritt bei Erfolg: PR vom Eigentümer manuell mergen.'
            echo "Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$CODE_RESULT" = success
          test "$BROWSER_RESULT" = success
