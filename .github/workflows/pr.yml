name: CCTV Viewer im PR prüfen
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  code-checks:
    name: Code prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/pr.yml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.10.0'
          cache: npm
      - name: Fehlende Prüfwerkzeuge installieren
        run: |
          missing=()
          for tool in ffmpeg shellcheck; do
            if ! command -v "$tool" >/dev/null 2>&1; then missing+=("$tool"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
      - name: Workflow, Shell und Python statisch prüfen
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
          shellcheck scripts/promote_image.sh scripts/smoke.sh
          bash -n scripts/promote_image.sh scripts/smoke.sh
          python3 -m compileall -q scripts
      - run: npm ci && npm run typecheck && npm test && npm run build
      - name: Browser-Testserver bauen
        run: mkdir -p bin && go build -o bin/cctv ./cmd/cctv
      - run: go vet ./...
      - name: Go-Race-Tests
        run: go test -race ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - id: meta
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-builds"
            echo "version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-server
          path: bin/cctv
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
  browser:
    name: Browser prüfen (${{ matrix.browser }})
    needs: code-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            engine: chromium
          - browser: webkit
            engine: webkit
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.code-checks.outputs.commit }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.10.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-test-server
          path: bin
      - run: chmod +x bin/cctv
      - name: Playwright Cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ matrix.browser }}-
      - name: Browser- und Systemabhängigkeiten installieren
        run: |
          npx playwright install-deps ${{ matrix.browser }}
          sudo apt-get install -y ffmpeg
          npx playwright install ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          CTV_TEST_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
  test:
    # Keep this name stable: main requires this exact status check.
    name: Anwendung prüfen
    if: always()
    needs: [code-checks, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Alle erforderlichen Prüfungen verlangen
        env:
          CODE_RESULT: ${{ needs.code-checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$CODE_RESULT" = success
          test "$BROWSER_RESULT" = success
