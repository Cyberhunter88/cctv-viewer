name: Prüfungen
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.10.0'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci && npm run typecheck && npm test && npm run build
      - run: go vet ./... && go test -race ./...
      - run: go build -o bin/cctv ./cmd/cctv
      - run: npx playwright install --with-deps chrome webkit
      - run: npm run test:browser
      - run: CTV_TEST_ENGINE=webkit npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: cctv-viewer:test
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
      - run: ./scripts/smoke.sh cctv-viewer:test
