name: CCTV Viewer bauen und prüfen
on:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ci-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  code-checks:
    name: Code prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.checks.outputs.commit }}
      image: ${{ steps.checks.outputs.image }}
      version: ${{ steps.checks.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - id: checks
        uses: ./.github/actions/code-checks
  build:
    name: Docker prüfen (${{ matrix.arch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: code-checks
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.code-checks.outputs.commit }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: source
        name: Vorhandenes Commit-Image wiederverwenden
        env:
          IMAGE: ${{ needs.code-checks.outputs.image }}
          VERSION: ${{ needs.code-checks.outputs.version }}
          COMMIT: ${{ needs.code-checks.outputs.commit }}
          ARCH: ${{ matrix.arch }}
        run: python3 scripts/image_registry.py resolve "$IMAGE" "$VERSION" "$COMMIT" "$ARCH"
      - id: image
        if: steps.source.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ needs.code-checks.outputs.image }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          build-args: VERSION=${{ needs.code-checks.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=commit-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=commit-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.code-checks.outputs.commit }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.code-checks.outputs.version }}
      - name: Genau das gebaute Image per Digest prüfen
        env:
          IMAGE_REF: ${{ steps.source.outputs.ref || format('{0}@{1}', needs.code-checks.outputs.image, steps.image.outputs.digest) }}
          VERSION: ${{ needs.code-checks.outputs.version }}
          COMMIT: ${{ needs.code-checks.outputs.commit }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker pull "$IMAGE_REF"
          ./scripts/smoke.sh "$IMAGE_REF" "$VERSION" "$COMMIT" "$ARCH"
          python3 scripts/image_registry.py record "$IMAGE_REF" "$VERSION" "$COMMIT" "$ARCH" "$RUNNER_TEMP/$ARCH.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-proof-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 90
  publish-commit:
    name: Commit-Image bereitstellen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [code-checks, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    timeout-minutes: 10
    concurrency:
      group: commit-image-${{ needs.code-checks.outputs.commit }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.code-checks.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-proof-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-proofs
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Geprüftes Multiarch-Image für den Commit veröffentlichen
        env:
          IMAGE: ${{ needs.code-checks.outputs.image }}
          COMMIT: ${{ needs.code-checks.outputs.commit }}
          VERSION: ${{ needs.code-checks.outputs.version }}
        run: python3 scripts/image_registry.py publish-commit "$IMAGE" "$VERSION" "$COMMIT" "$RUNNER_TEMP/image-proofs" "$RUNNER_TEMP/commit-image-proof.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commit-image-proof-${{ github.run_attempt }}
          path: ${{ runner.temp }}/commit-image-proof.json
          if-no-files-found: error
          retention-days: 90
  test:
    # Keep this name stable: main requires this exact status check.
    name: Anwendung prüfen
    if: always()
    needs: [code-checks, build, publish-commit]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Alle erforderlichen Prüfungen verlangen
        env:
          CODE_RESULT: ${{ needs.code-checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish-commit.result }}
        run: |
          {
            echo '## Ergebnis der Pflichtprüfungen'
            echo
            echo "Code: $CODE_RESULT"
            echo "Native Docker-Smoke-Tests (AMD64 und ARM64): $BUILD_RESULT"
            echo "Commit-Image: $PUBLISH_RESULT"
            echo 'Nächster Schritt bei Erfolg: Release manuell mit passender Version und diesem Commit starten.'
            echo "Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$CODE_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$PUBLISH_RESULT" = success
