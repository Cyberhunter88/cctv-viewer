name: CCTV Viewer bauen und prüfen
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  code-checks:
    name: Code prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.10.0'
          cache: npm
      - name: Fehlende Prüfwerkzeuge installieren
        run: |
          missing=()
          for tool in ffmpeg shellcheck; do
            if ! command -v "$tool" >/dev/null 2>&1; then missing+=("$tool"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
      - name: Workflow, Shell und Python statisch prüfen
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
          shellcheck scripts/promote_image.sh scripts/smoke.sh
          bash -n scripts/promote_image.sh scripts/smoke.sh
          python3 -m compileall -q scripts
      - run: npm ci && npm run typecheck && npm test && npm run build
      - name: Browser-Testserver bauen
        run: mkdir -p bin && go build -o bin/cctv ./cmd/cctv
      - run: go vet ./...
      - name: Go-Race-Tests
        run: go test -race ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - id: meta
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-builds"
            echo "version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-server
          path: bin/cctv
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
  browser:
    name: Browser prüfen (${{ matrix.browser }})
    needs: code-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            engine: chromium
          - browser: webkit
            engine: webkit
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.code-checks.outputs.commit }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.10.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-test-server
          path: bin
      - run: chmod +x bin/cctv
      - name: Playwright Cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ matrix.browser }}-
      - name: Browser- und Systemabhängigkeiten installieren
        run: |
          npx playwright install-deps ${{ matrix.browser }}
          sudo apt-get install -y ffmpeg
          npx playwright install ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          CTV_TEST_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
  build:
    name: Docker prüfen (${{ matrix.arch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [code-checks, browser]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.code-checks.outputs.commit }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: source
        name: Vorhandenes Commit-Image wiederverwenden
        env:
          IMAGE: ${{ needs.code-checks.outputs.image }}
          VERSION: ${{ needs.code-checks.outputs.version }}
          COMMIT: ${{ needs.code-checks.outputs.commit }}
          ARCH: ${{ matrix.arch }}
        run: python3 scripts/image_registry.py resolve "$IMAGE" "$VERSION" "$COMMIT" "$ARCH"
      - id: image
        if: steps.source.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ needs.code-checks.outputs.image }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          build-args: VERSION=${{ needs.code-checks.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=commit-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=commit-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.code-checks.outputs.commit }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.code-checks.outputs.version }}
      - name: Genau das gebaute Image per Digest prüfen
        env:
          IMAGE_REF: ${{ steps.source.outputs.ref || format('{0}@{1}', needs.code-checks.outputs.image, steps.image.outputs.digest) }}
          VERSION: ${{ needs.code-checks.outputs.version }}
          COMMIT: ${{ needs.code-checks.outputs.commit }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker pull "$IMAGE_REF"
          ./scripts/smoke.sh "$IMAGE_REF" "$VERSION" "$COMMIT" "$ARCH"
          python3 scripts/image_registry.py record "$IMAGE_REF" "$VERSION" "$COMMIT" "$ARCH" "$RUNNER_TEMP/$ARCH.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-proof-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 90
  publish-commit:
    name: Commit-Image bereitstellen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [code-checks, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    timeout-minutes: 10
    concurrency:
      group: commit-image-${{ needs.code-checks.outputs.commit }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.code-checks.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-proof-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-proofs
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Geprüftes Multiarch-Image für den Commit veröffentlichen
        env:
          IMAGE: ${{ needs.code-checks.outputs.image }}
          COMMIT: ${{ needs.code-checks.outputs.commit }}
          VERSION: ${{ needs.code-checks.outputs.version }}
        run: python3 scripts/image_registry.py publish-commit "$IMAGE" "$VERSION" "$COMMIT" "$RUNNER_TEMP/image-proofs" "$RUNNER_TEMP/commit-image-proof.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commit-image-proof-${{ github.run_attempt }}
          path: ${{ runner.temp }}/commit-image-proof.json
          if-no-files-found: error
          retention-days: 90
  test:
    # Keep this name stable: main already requires this exact status check.
    name: Anwendung prüfen
    if: always()
    needs: [code-checks, browser, build, publish-commit]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Alle für das Ereignis erforderlichen Prüfungen verlangen
        env:
          CODE_RESULT: ${{ needs.code-checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish-commit.result }}
          MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          test "$CODE_RESULT" = success
          test "$BROWSER_RESULT" = success
          if [ "$MAIN_PUSH" = true ]; then
            test "$BUILD_RESULT" = success
            test "$PUBLISH_RESULT" = success
          fi
