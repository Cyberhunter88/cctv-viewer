services:
  cctv-viewer:
    image: ghcr.io/cyberhunter88/cctv-viewer:${CTV_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    user: "${CTV_UID:-10001}:${CTV_GID:-10001}"
    ports:
      - "${CTV_BIND_ADDRESS:-127.0.0.1}:${CTV_HTTP_PORT:-8080}:8080"
    volumes:
      - ${CTV_RECORDINGS_PATH:?Aufnahmeordner in .env eintragen}:/recordings:ro
      - ${CTV_DATA_PATH:-./data}:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    pids_limit: 128
