services:
  cctv-viewer:
    image: ghcr.io/cyberhunter88/cctv-viewer:${CTV_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      CTV_LIVE_RTSP_ADDRESS: "0.0.0.0:8554"
    user: "${CTV_UID:-10001}:${CTV_GID:-10001}"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8554:8554/tcp"
    volumes:
      - ./recordings:/recordings:ro
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    pids_limit: 128
